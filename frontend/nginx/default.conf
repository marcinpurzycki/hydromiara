server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Files with a content hash in the name never change.
    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Behind Traefik the /api path goes straight to the API service. This block
    # serves the same path when the page is opened without a reverse proxy
    # (docker-compose.local.yml). The name is resolved on each request, so the
    # page starts also when the API is not running yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://hydromiara-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Every other address is a screen of the page (report addresses included).
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
