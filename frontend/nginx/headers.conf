# Security headers of the page. nginx drops inherited add_header lines in a
# location that sets its own, so every location includes this file.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# The page loads only its own files, map tiles from the Geoportal and address
# search results from the geocoding service of GUGiK.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://mapy.geoportal.gov.pl; connect-src 'self' https://services.gugik.gov.pl https://uldk.gugik.gov.pl; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
