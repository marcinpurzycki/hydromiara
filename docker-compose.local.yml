# Local use without Traefik: publishes the page and the API on localhost.
#   docker network create proxy   (once)
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# The page is then at http://localhost:8080 and reaches the API under /api.

services:
  api:
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
  web:
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:80
