# Two services behind an existing Traefik instance on the external network "proxy".
# Copy .env.example to .env and fill it in before starting.

name: hydromiara

# Size limit of the container logs, set here so that it holds also where the
# Docker daemon has no log rotation configured.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      SATELLITE_PRIMARY: ${SATELLITE_PRIMARY:-planetary-computer}
      SATELLITE_SECONDARY: ${SATELLITE_SECONDARY:-earth-search}
      SATELLITE_FALLBACK_AFTER_S: ${SATELLITE_FALLBACK_AFTER_S:-4}
      # Report summary by a language model; empty key or model = template summary.
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      # Addresses whose X-Forwarded-For is trusted (the reverse proxy); the
      # request limits count per client address only when this names the proxy.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Request limits per client address and the limit of analyses running at
      # the same time; empty = defaults of the service (backend/app/api/limits.py).
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
      RATE_LIMIT_ANALYSIS_PER_MINUTE: ${RATE_LIMIT_ANALYSIS_PER_MINUTE:-}
      RATE_LIMIT_ANALYSIS_PER_HOUR: ${RATE_LIMIT_ANALYSIS_PER_HOUR:-}
      RATE_LIMIT_DERIVE_PER_MINUTE: ${RATE_LIMIT_DERIVE_PER_MINUTE:-}
      RATE_LIMIT_LOOKUP_PER_MINUTE: ${RATE_LIMIT_LOOKUP_PER_MINUTE:-}
      RATE_LIMIT_SIMULATION_PER_MINUTE: ${RATE_LIMIT_SIMULATION_PER_MINUTE:-}
      RATE_LIMIT_STATUS_PER_MINUTE: ${RATE_LIMIT_STATUS_PER_MINUTE:-}
      RATE_LIMIT_OTHER_PER_MINUTE: ${RATE_LIMIT_OTHER_PER_MINUTE:-}
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-}
    volumes:
      - reports:/data/reports
      - ${EDO_DATA_PATH:-./data/edo}:/data/edo:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      proxy:
        # Name under which the page reaches the API when there is no reverse
        # proxy in front (docker-compose.local.yml).
        aliases:
          - hydromiara-api
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.hydromiara-api.rule=Host(`${DOMAIN:?set DOMAIN in .env}`) && PathPrefix(`/api`)
      - traefik.http.routers.hydromiara-api.entrypoints=${TRAEFIK_ENTRYPOINT:?set TRAEFIK_ENTRYPOINT in .env}
      - traefik.http.routers.hydromiara-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER in .env}
      - traefik.http.services.hydromiara-api.loadbalancer.server.port=8000

  # Page for the farmer (static files served by nginx).
  web:
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.hydromiara-web.rule=Host(`${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.hydromiara-web.entrypoints=${TRAEFIK_ENTRYPOINT:?set TRAEFIK_ENTRYPOINT in .env}
      - traefik.http.routers.hydromiara-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER in .env}
      - traefik.http.services.hydromiara-web.loadbalancer.server.port=80

networks:
  proxy:
    external: true

volumes:
  reports:
